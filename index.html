<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="知識島大冒險：國小一到六年級全科闖關學習遊戲，國語、數學、英語、生活、自然、社會。">
<title>知識島大冒險｜國小全科闖關</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="sky"><i class="cloud c1"></i><i class="cloud c2"></i><i class="cloud c3"></i></div>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <button class="avatar" id="avBtn" onclick="openProfile()" title="我的檔案">🧒</button>
      <div><span class="logo">🏝️ 知識島大冒險</span><small>國小全科闖關</small></div>
    </div>
    <div class="stats">
      <span class="pill" title="金幣">🪙 <b id="sCoin">0</b></span>
      <span class="pill" title="星星">⭐ <b id="sStar">0</b></span>
      <span class="pill" title="連續學習天數">🔥 <b id="sStreak">0</b></span>
      <button class="pill btn" onclick="openShop()">🎁 商店</button>
      <button class="pill btn icon" onclick="toggleSound()" id="sndBtn" title="音效">🔊</button>
      <button class="pill btn icon" onclick="toggleMusic()" id="musBtn" title="背景音樂">🎵</button>
      <button class="pill btn icon" onclick="toggleFull()" title="全螢幕">⛶</button>
    </div>
  </header>
  <main id="app"></main>
  <footer>
    <a onclick="openParents()">👪 家長專區</a>·
    <a onclick="openAch()">🏅 成就</a>·
    <a onclick="resetAll()">🔄 重設進度</a>
    <div class="fine">題目依國小課綱學習重點自編，僅供練習參考。學習紀錄只儲存在這台裝置的瀏覽器中。</div>
  </footer>
</div>
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>
<div class="story" id="story" style="display:none"></div>
<script src="js/questions.js"></script>
<script src="js/app.js"></script>
</body>
</html>
