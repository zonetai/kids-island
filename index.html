<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="知識島探險隊：國小一到六年級全科闖關學習遊戲，國語、數學、英語、生活、自然、社會。">
<title>知識島探險隊｜國小全科闖關</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="sky"><i class="cloud c1"></i><i class="cloud c2"></i><i class="cloud c3"></i></div>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <button class="avatar" id="avBtn" onclick="openProfile()" title="我的檔案">🧒</button>
      <div><span class="logo">🏝️ 知識島探險隊</span><small>國小全科闖關</small></div>
    </div>
    <div class="stats">
      <span class="pill" title="金幣">🪙 <b id="sCoin">0</b></span>
      <span class="pill" title="星星">⭐ <b id="sStar">0</b></span>
      <span class="pill" title="連續學習天數">🔥 <b id="sStreak">0</b></span>
      <button class="pill btn" onclick="openShop()">🎁 商店</button>
      <button class="pill btn icon" onclick="toggleSound()" id="sndBtn" title="音效">🔊</button>
      <button class="pill btn icon" onclick="toggleMusic()" id="musBtn" title="背景音樂">🎵</button>
      <button class="pill btn icon" onclick="toggleFull()" title="全螢幕">⛶</button>
      <button class="pill btn" onclick="openSync()" id="syncBtn" style="display:none">☁️</button>
    </div>
  </header>
  <main id="app"></main>
  <footer>
    <a onclick="openParents()">👪 家長專區</a>·
    <a onclick="openAch()">🏅 成就</a>·
    <a onclick="resetAll()">🔄 重設進度</a>
    <div class="fine">本站為獨立自製的免費學習遊戲，題目、角色、故事與程式皆為原創，題目依國小課綱學習重點自編，僅供練習參考。單元名稱依學校課程計畫，練習題為本站自編。學習紀錄儲存在瀏覽器中，開啟家庭同步後才會上傳雲端。</div>
  </footer>
</div>
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>
<div class="story" id="story" style="display:none"></div>
<script src="js/config.js"></script>
<script src="js/questions.js"></script>
<script src="js/english.js"></script>
<script src="js/curriculum.js"></script>
<script src="js/cur/math.js"></script>
<script src="js/cur/g4-chinese.js"></script>
<script src="js/cur/g6-chinese.js"></script>
<script src="js/cur/social.js"></script>
<script src="js/cur/science.js"></script>
<script src="js/cur/english.js"></script>
<script src="js/cur/alt.js"></script>
<script src="js/sync.js"></script>
<script src="js/app.js"></script>
</body>
</html>
